<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Helvetica, Arial, sans-serif" font-size="13">

  <!-- ─────────────── styles ─────────────── -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b00"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#070"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#06a"/>
    </marker>

    <style><![CDATA[
      .blk      { fill:#fff; stroke:#222; stroke-width:1.5; }
      .blk-clk  { fill:#fff5e0; stroke:#a60; stroke-width:1.5; }
      .blk-i2s  { fill:#eef7ff; stroke:#06a; stroke-width:1.5; }
      .blk-asrc { fill:#f0fff0; stroke:#070; stroke-width:1.5; }
      .blk-test { fill:#f8eaff; stroke:#609; stroke-width:1.5; }
      .blk-dac  { fill:#ffeeee; stroke:#b00; stroke-width:1.5; }
      .blk-dbg  { fill:#fafafa; stroke:#888; stroke-width:1; stroke-dasharray:4 3; }
      .pin      { fill:#fff8b0; stroke:#aa5; stroke-width:1.2; }
      .lbl      { font-weight:bold; }
      .sub      { fill:#444; font-size:11px; font-style:italic; }
      .wire     { stroke:#222; stroke-width:1.5; fill:none; }
      .wire-clk { stroke:#a60; stroke-width:1.3; fill:none; stroke-dasharray:5 3; }
      .wire-r   { stroke:#b00; stroke-width:1.5; fill:none; }
      .wire-g   { stroke:#070; stroke-width:1.5; fill:none; }
      .wire-b   { stroke:#06a; stroke-width:1.5; fill:none; }
      .mux      { fill:#fff; stroke:#222; stroke-width:1.5; }
      .note     { font-size:11px; fill:#555; font-style:italic; }
      .title    { font-size:22px; font-weight:bold; }
      .legend   { font-size:12px; }
    ]]></style>
  </defs>

  <!-- title -->
  <text x="800" y="32" text-anchor="middle" class="title">toy-dac — Top-Level Block Diagram (April 2026)</text>
  <text x="800" y="52" text-anchor="middle" class="sub">FPGA = Xilinx 7-series, MCLK = 108 MHz, target Fs_out = 1.6875 MHz (= MCLK/64)</text>

  <!-- ─────────────── PHYSICAL INPUTS (left edge) ─────────────── -->
  <rect class="pin" x="20"  y="120" width="80" height="30" rx="4"/>
  <text x="60"  y="140" text-anchor="middle">clk (12 MHz)</text>

  <rect class="pin" x="20"  y="220" width="80" height="30" rx="4"/>
  <text x="60"  y="240" text-anchor="middle">bclk</text>

  <rect class="pin" x="20"  y="260" width="80" height="30" rx="4"/>
  <text x="60"  y="280" text-anchor="middle">lrclk</text>

  <rect class="pin" x="20"  y="300" width="80" height="30" rx="4"/>
  <text x="60"  y="320" text-anchor="middle">din</text>

  <rect class="pin" x="20"  y="500" width="80" height="30" rx="4"/>
  <text x="60"  y="520" text-anchor="middle">btn[0]</text>
  <text x="60"  y="495" text-anchor="middle" class="sub">mode cycle</text>

  <rect class="pin" x="20"  y="540" width="80" height="30" rx="4"/>
  <text x="60"  y="560" text-anchor="middle">btn[1]</text>
  <text x="60"  y="585" text-anchor="middle" class="sub">dither tog</text>

  <rect class="pin" x="20"  y="620" width="80" height="30" rx="4"/>
  <text x="60"  y="640" text-anchor="middle">bypass</text>
  <text x="60"  y="665" text-anchor="middle" class="sub">PIO6 (HIGH = A/B)</text>

  <!-- ─────────────── CLOCK / RESET ─────────────── -->
  <rect class="blk-clk" x="140" y="100" width="200" height="80" rx="6"/>
  <text x="240" y="125" text-anchor="middle" class="lbl">MMCM (clock IP)</text>
  <text x="240" y="145" text-anchor="middle" class="sub">×63 / ÷7 → 108 MHz</text>
  <text x="240" y="163" text-anchor="middle" class="sub">locked → !rst</text>

  <line class="wire-clk" x1="100" y1="135" x2="140" y2="135" marker-end="url(#arr)"/>
  <line class="wire-clk" x1="340" y1="135" x2="380" y2="135"/>
  <text x="365" y="125" class="sub" text-anchor="end">mclk</text>

  <!-- mclk distribution rail -->
  <line class="wire-clk" x1="380" y1="135" x2="380" y2="1000"/>
  <text x="385" y="998" class="sub">→ mclk distributed to all blocks</text>

  <!-- ─────────────── I2S RECEIVER ─────────────── -->
  <rect class="blk-i2s" x="140" y="210" width="220" height="130" rx="6"/>
  <text x="250" y="232" text-anchor="middle" class="lbl">i2s.v</text>
  <text x="250" y="250" text-anchor="middle" class="sub">3-FF synchronizers on bclk/lrclk/din</text>
  <text x="250" y="268" text-anchor="middle" class="sub">2 × 32-bit shift register</text>
  <text x="250" y="286" text-anchor="middle" class="sub">AXI handshake (held tvalid)</text>
  <text x="250" y="306" text-anchor="middle" class="sub">out_left / out_right (signed Q1.31)</text>
  <text x="250" y="324" text-anchor="middle" class="sub">left_valid / right_valid</text>

  <line class="wire" x1="100" y1="235" x2="140" y2="235" marker-end="url(#arr)"/>
  <line class="wire" x1="100" y1="275" x2="140" y2="275" marker-end="url(#arr)"/>
  <line class="wire" x1="100" y1="315" x2="140" y2="315" marker-end="url(#arr)"/>

  <!-- ─────────────── RATE DETECT / MANAGER ─────────────── -->
  <rect class="blk-i2s" x="400" y="210" width="220" height="130" rx="6"/>
  <text x="510" y="232" text-anchor="middle" class="lbl">rate_detect + rate_manager</text>
  <text x="510" y="252" text-anchor="middle" class="sub">avg lrclk period over 256 frames</text>
  <text x="510" y="270" text-anchor="middle" class="sub">classify: 32k / 44.1k / 48k</text>
  <text x="510" y="288" text-anchor="middle" class="sub">debounce + 250 ms settle</text>
  <text x="510" y="306" text-anchor="middle" class="sub">drives step_nominal, asrc_rst, mute</text>
  <text x="510" y="324" text-anchor="middle" class="sub">→ rm_rate_locked, rm_rate_code</text>

  <line class="wire" x1="360" y1="275" x2="400" y2="275" marker-end="url(#arr)"/>
  <text x="380" y="265" class="sub" text-anchor="middle">lrclk_pos_edge</text>

  <!-- ─────────────── MODE FSM / SOURCE MUX ─────────────── -->
  <rect class="blk-test" x="140" y="430" width="220" height="60" rx="6"/>
  <text x="250" y="453" text-anchor="middle" class="lbl">mode FSM</text>
  <text x="250" y="473" text-anchor="middle" class="sub">btn[0] cycles I2S/DDS/DC/OFF</text>

  <line class="wire" x1="100" y1="515" x2="140" y2="490" marker-end="url(#arr)"/>

  <!-- DDS test source -->
  <rect class="blk-test" x="400" y="430" width="220" height="60" rx="6"/>
  <text x="510" y="453" text-anchor="middle" class="lbl">DDS Compiler IP (1 kHz)</text>
  <text x="510" y="473" text-anchor="middle" class="sub">26-bit sine ⟪ 5 → 32-bit</text>

  <!-- DC test source -->
  <rect class="blk-test" x="400" y="510" width="220" height="40" rx="6"/>
  <text x="510" y="535" text-anchor="middle" class="lbl">DC source = 0x7FFF_FFFF / 1000</text>

  <!-- src mux (test_held + sample_div) -->
  <rect class="blk-test" x="660" y="430" width="180" height="120" rx="6"/>
  <text x="750" y="452" text-anchor="middle" class="lbl">source mux + Fs pacer</text>
  <text x="750" y="470" text-anchor="middle" class="sub">SAMPLE_DIV @ 44.1 kHz</text>
  <text x="750" y="488" text-anchor="middle" class="sub">case (mode):</text>
  <text x="750" y="504" text-anchor="middle" class="sub">  I2S→ i2s_left</text>
  <text x="750" y="520" text-anchor="middle" class="sub">  DDS→ test_held</text>
  <text x="750" y="536" text-anchor="middle" class="sub">  DC → DC_LEVEL</text>

  <line class="wire" x1="620" y1="455" x2="660" y2="455" marker-end="url(#arr)"/>
  <line class="wire" x1="620" y1="525" x2="660" y2="525" marker-end="url(#arr)"/>

  <!-- I2S samples to source mux -->
  <line class="wire-b" x1="360" y1="305" x2="660" y2="450" marker-end="url(#arrB)"/>
  <text x="425" y="375" class="sub" fill="#06a">i2s_left/right (MODE_I2S)</text>

  <!-- ─────────────── ASRC ─────────────── -->
  <rect class="blk-asrc" x="700" y="200" width="380" height="200" rx="6"/>
  <text x="890" y="225" text-anchor="middle" class="lbl">asrc.v (fractional-phase polyphase)</text>
  <text x="890" y="246" text-anchor="middle" class="sub">2 × fractional_asrc engines (L, R)</text>
  <text x="890" y="263" text-anchor="middle" class="sub">256 phases × 64 taps × 18-bit (BRAM)</text>
  <text x="890" y="280" text-anchor="middle" class="sub">step = step_nominal + servo_pi_out</text>
  <text x="890" y="297" text-anchor="middle" class="sub">in: i2s_left/right + accept pulses</text>
  <text x="890" y="314" text-anchor="middle" class="sub">out: dac_in_*_paced @ Fs_out (1.6875 MHz)</text>
  <text x="890" y="334" text-anchor="middle" class="sub">+ frac_servo (PI on ring fill, pipelined)</text>
  <text x="890" y="354" text-anchor="middle" class="sub">  KP=2048 KI=64 setpoint=32 update=100 Hz</text>
  <text x="890" y="374" text-anchor="middle" class="sub">enable = (mode == MODE_I2S)</text>
  <text x="890" y="392" text-anchor="middle" class="sub">SAMP_DEPTH=128, prime → samp_avail=32</text>

  <!-- I2S → ASRC -->
  <line class="wire-b" x1="360" y1="295" x2="700" y2="270" marker-end="url(#arrB)"/>
  <text x="500" y="220" class="sub" fill="#06a">i2s_left + i2s_left_accept (1-cyc)</text>

  <!-- rate_manager → ASRC -->
  <line class="wire" x1="620" y1="265" x2="700" y2="240" marker-end="url(#arr)"/>
  <text x="660" y="232" class="sub">step_nominal, asrc_rst, mute</text>

  <!-- ─────────────── DAC INPUT MUX ─────────────── -->
  <polygon class="mux" points="1140,260 1200,300 1140,340 1140,260"/>
  <text x="1170" y="305" text-anchor="middle" class="lbl">mux</text>
  <text x="1245" y="245" class="sub">i2s_path &amp;&amp; bypass_active</text>
  <text x="1245" y="295" class="sub">i2s_path</text>
  <text x="1245" y="345" class="sub">test mode (DDS/DC)</text>

  <line class="wire-g" x1="1080" y1="290" x2="1140" y2="295" marker-end="url(#arrG)"/>
  <text x="1090" y="285" class="sub" fill="#070">paced</text>

  <line class="wire-b" x1="360" y1="280" x2="1140" y2="275" marker-end="url(#arrB)"/>
  <text x="900" y="195" class="sub" fill="#06a">raw I2S (bypass=HIGH)</text>

  <line class="wire" x1="840" y1="490" x2="1140" y2="325" marker-end="url(#arr)"/>
  <text x="1015" y="475" class="sub">test src</text>

  <!-- bypass control -->
  <line class="wire" x1="100" y1="635" x2="1170" y2="350" stroke-dasharray="3 3"/>
  <text x="1175" y="365" class="sub">bypass_active = i2s_mode &amp; bypass</text>

  <!-- ─────────────── DAC ΔΣ MODULATOR ─────────────── -->
  <rect class="blk-dac" x="1240" y="430" width="320" height="180" rx="6"/>
  <text x="1400" y="455" text-anchor="middle" class="lbl">dac.v × 2 (left, right)</text>
  <text x="1400" y="475" text-anchor="middle" class="sub">CIFB ΔΣ modulator, ORDER=2</text>
  <text x="1400" y="491" text-anchor="middle" class="sub">Pascal coeffs {1,2}, OBG=4 (stable)</text>
  <text x="1400" y="507" text-anchor="middle" class="sub">42-bit integrators + GUARD=10</text>
  <text x="1400" y="523" text-anchor="middle" class="sub">combinational comparator (sign bit)</text>
  <text x="1400" y="541" text-anchor="middle" class="sub">TPDF dither @ ±2²⁴</text>
  <text x="1400" y="557" text-anchor="middle" class="sub">din latched on dvalid; otherwise held</text>
  <text x="1400" y="577" text-anchor="middle" class="sub">→ 1-bit dout @ MCLK (108 MHz)</text>
  <text x="1400" y="595" text-anchor="middle" class="sub">⚠ ORDER=3 with these coeffs is UNSTABLE</text>

  <line class="wire" x1="1200" y1="300" x2="1240" y2="445" marker-end="url(#arr)"/>
  <text x="1230" y="380" class="sub">dac_din + dac_dvalid</text>

  <!-- Dither sources -->
  <rect class="blk-dac" x="1240" y="640" width="150" height="60" rx="6"/>
  <text x="1315" y="663" text-anchor="middle" class="lbl">random.v ×2</text>
  <text x="1315" y="683" text-anchor="middle" class="sub">2 × 64-bit XORshift PRNG</text>
  <line class="wire" x1="1390" y1="670" x2="1450" y2="670" marker-end="url(#arr)"/>
  <line class="wire" x1="1450" y1="670" x2="1450" y2="610"/>
  <text x="1455" y="640" class="sub">dither1, dither2</text>

  <!-- IOB output drivers -->
  <rect class="blk-dac" x="1240" y="730" width="320" height="100" rx="6"/>
  <text x="1400" y="755" text-anchor="middle" class="lbl">IOB output flops (IOB=TRUE)</text>
  <text x="1400" y="775" text-anchor="middle" class="sub">dout + ~dout, registered in pad</text>
  <text x="1400" y="793" text-anchor="middle" class="sub">muted to 0 if MODE_OFF or audio_mute</text>
  <text x="1400" y="813" text-anchor="middle" class="sub">→ dac_out_l, dac_out_ln, _r, _rn</text>

  <line class="wire-r" x1="1400" y1="610" x2="1400" y2="730" marker-end="url(#arrR)"/>
  <text x="1405" y="700" class="sub" fill="#b00">dout_l, dout_r</text>

  <rect class="pin" x="1480" y="845" width="80" height="30" rx="4"/>
  <text x="1520" y="865" text-anchor="middle">dac_out_l/_ln</text>
  <rect class="pin" x="1480" y="880" width="80" height="30" rx="4"/>
  <text x="1520" y="900" text-anchor="middle">dac_out_r/_rn</text>

  <line class="wire-r" x1="1400" y1="830" x2="1480" y2="860" marker-end="url(#arrR)"/>
  <line class="wire-r" x1="1400" y1="830" x2="1480" y2="895" marker-end="url(#arrR)"/>

  <!-- ─────────────── LEDs / DEBUG (bottom) ─────────────── -->
  <rect class="blk-dbg" x="140" y="700" width="380" height="240" rx="6"/>
  <text x="330" y="725" text-anchor="middle" class="lbl">LED + debug pin assignments</text>

  <text x="160" y="755" class="sub">led[1:0] = mode (00=I2S, 01=DDS, 10=DC, 11=OFF)</text>
  <text x="160" y="773" class="sub">led[2]   = mclk_locked</text>
  <text x="160" y="791" class="sub">led[3]   = rm_rate_locked</text>

  <text x="160" y="817" class="sub">fifo_led[3:0] = detected rate when locked, else FIFO HWM bar</text>

  <text x="160" y="843" class="sub">led0_b = sanity-check ~1 Hz blink (proof of fresh bitstream)</text>

  <text x="160" y="875" class="sub">debug1 = mclk_locked</text>
  <text x="160" y="893" class="sub">debug2 = i2s_sample_toggle (~22 kHz square when audio flowing)</text>
  <text x="160" y="911" class="sub">debug3 = frame_size_anomaly (5 ms-stretched, bclk-per-frame deviation)</text>
  <text x="160" y="929" class="sub">debug4 = i2s_zero_word    (pulses on each accepted near-zero sample)</text>

  <!-- ─────────────── LEGEND (right of debug) ─────────────── -->
  <rect class="blk-dbg" x="560" y="700" width="320" height="240" rx="6"/>
  <text x="720" y="725" text-anchor="middle" class="lbl">Legend</text>

  <line class="wire-b" x1="580" y1="755" x2="640" y2="755" marker-end="url(#arrB)"/>
  <text x="650" y="759" class="legend">I2S audio words (signed 32-bit)</text>

  <line class="wire-g" x1="580" y1="780" x2="640" y2="780" marker-end="url(#arrG)"/>
  <text x="650" y="784" class="legend">ASRC-resampled audio (paced @ Fs_out)</text>

  <line class="wire-r" x1="580" y1="805" x2="640" y2="805" marker-end="url(#arrR)"/>
  <text x="650" y="809" class="legend">1-bit ΔΣ stream → analog</text>

  <line class="wire-clk" x1="580" y1="830" x2="640" y2="830"/>
  <text x="650" y="834" class="legend">clocks</text>

  <line class="wire" x1="580" y1="855" x2="640" y2="855" marker-end="url(#arr)"/>
  <text x="650" y="859" class="legend">control / config</text>

  <rect class="blk-i2s" x="580" y="875" width="20" height="14"/>
  <text x="610" y="887" class="legend">I2S input domain</text>
  <rect class="blk-asrc" x="580" y="893" width="20" height="14"/>
  <text x="610" y="905" class="legend">ASRC (sample-rate conversion)</text>
  <rect class="blk-test" x="580" y="911" width="20" height="14"/>
  <text x="610" y="923" class="legend">internal test sources</text>
  <rect class="blk-dac" x="780" y="875" width="20" height="14"/>
  <text x="810" y="887" class="legend">ΔΣ DAC + analog</text>
  <rect class="blk-clk" x="780" y="893" width="20" height="14"/>
  <text x="810" y="905" class="legend">clock generation</text>
  <rect class="blk-dbg" x="780" y="911" width="20" height="14"/>
  <text x="810" y="923" class="legend">diagnostics (no datapath)</text>

  <!-- ─────────────── KEY NUMBERS BOX ─────────────── -->
  <rect class="blk-dbg" x="920" y="700" width="640" height="240" rx="6"/>
  <text x="1240" y="725" text-anchor="middle" class="lbl">Key constants &amp; data widths</text>

  <text x="940" y="755" class="legend"><tspan font-weight="bold">MCLK</tspan> = 108 MHz (MMCM ×63 / ÷7 from 12 MHz crystal)</text>
  <text x="940" y="775" class="legend"><tspan font-weight="bold">Fs_out</tspan> = MCLK / ASRC_OUT_DIV = 108 MHz / 64 = 1.6875 MHz (ΔΣ rate)</text>
  <text x="940" y="795" class="legend"><tspan font-weight="bold">Fs_in</tspan>  = 32k / 44.1k / 48k (auto-detected by rate_manager)</text>
  <text x="940" y="815" class="legend"><tspan font-weight="bold">ASRC</tspan>  = 256 phases × 64 taps polyphase, 18-bit coeffs in BRAM,</text>
  <text x="940" y="833" class="legend">         single MAC, 6-stage pipeline, ring-buffer 128 deep</text>
  <text x="940" y="853" class="legend"><tspan font-weight="bold">PI servo</tspan> on ring-buffer fill, pipelined for 108 MHz timing</text>
  <text x="940" y="873" class="legend"><tspan font-weight="bold">Modulator</tspan> = CIFB ΔΣ ORDER=2 (Pascal coeffs {1,2}), 42-bit integ.</text>
  <text x="940" y="891" class="legend"><tspan font-weight="bold">Audio word</tspan> = signed 32-bit (Q1.31) end-to-end</text>
  <text x="940" y="911" class="legend"><tspan font-weight="bold">Output</tspan> = differential 1-bit pair (dac_out_l / _ln) @ MCLK rate</text>
  <text x="940" y="931" class="legend"><tspan font-weight="bold">SNR target</tspan> ≈ 70 dB in 20 kHz audio band (ORDER=2, OSR=38)</text>

  <!-- ─────────────── FOOTNOTE ─────────────── -->
  <text x="800" y="1060" text-anchor="middle" class="sub">Removed since previous bring-up: legacy `interpolator100x` (Xilinx FIR Compiler IP) — failed 108 MHz timing and bypassed in datapath.</text>
  <text x="800" y="1078" text-anchor="middle" class="sub">Bypass mode (bypass=HIGH) now feeds raw I2S samples directly to the DAC, no resampling.</text>

</svg>
